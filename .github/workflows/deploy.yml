name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp version (shown in the game)
        run: |
          echo "window.GROVE_VERSION = { version: '0.16.${{ github.run_number }}', sha: '${GITHUB_SHA::7}', built: '$(TZ=America/Chicago date '+%b %-d %-I:%M%p')' };" > js/version.tmp
          tail -n +4 js/version.js >> js/version.tmp && mv js/version.tmp js/version.js
          cat js/version.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
